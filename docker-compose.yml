version: "3.9"

services:
  user-service:
    build:
      context: ./backend-container/UserService
      dockerfile: ${USER_SERVICE_DOCKERFILE:-Dockerfile}
    container_name: user-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Test}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${USER_SERVICE_CONNECTION}
      HOME: /home/appuser
      USE_AZURE_DEFAULT_CREDENTIAL: ${USE_AZURE_DEFAULT_CREDENTIAL:-false}
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
    ports:
      - "8080:8080"
    networks:
      - medicare-network
    restart: unless-stopped
    volumes:
      - ${HOST_AZURE_DIR:-${HOME}/.azure}:/home/appuser/.azure:ro

  frontend:
    build:
      context: ./frontend-container/medicare-frontend
      dockerfile: Dockerfile
    container_name: medicare-frontend
    ports:
      - "5173:80"
    depends_on:
      - user-service
    networks:
      - medicare-network
    restart: unless-stopped
    environment:
      # Provided to nginx static build via build ARG/env (for SSR you'd rehydrate differently). If using Vite env replacement at build time, rebuild when this changes.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://user-service:8080/api}

  # Optional local SQL Server for development (disabled by default; uncomment to use)
  # sqlserver:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   container_name: sqlserver
  #   environment:
  #     ACCEPT_EULA: Y
  #     SA_PASSWORD: YourStrong!Passw0rd
  #   ports:
  #     - "1433:1433"
  #   healthcheck:
  #     test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1' || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 20s
  #   networks:
  #     - medicare-network

networks:
  medicare-network:
    driver: bridge

volumes: {}
