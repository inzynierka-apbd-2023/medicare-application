services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-medicare}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-medicare}"
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - medicare-network
    restart: unless-stopped

  user-service:
    build:
      context: ./backend-container/UserService
      dockerfile: ${USER_SERVICE_DOCKERFILE:-Dockerfile}
    container_name: user-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Test}
      ASPNETCORE_URLS: http://+:8080
          ConnectionStrings__DefaultConnection: ${USER_SERVICE_CONNECTION}
      HOME: /home/appuser
      USE_AZURE_DEFAULT_CREDENTIAL: ${USE_AZURE_DEFAULT_CREDENTIAL:-false}
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
      RABBITMQ__HOST: "${RABBITMQ_HOST:-rabbitmq}"
      RABBITMQ__USERNAME: "${RABBITMQ_USERNAME:-medicare}"
      RABBITMQ__PASSWORD: "${RABBITMQ_PASSWORD:-medicare}"
    ports:
      - "8080:8080"
    networks:
      - medicare-network
    restart: unless-stopped
    volumes:
          - ${HOST_AZURE_DIR:-${HOME}/.azure}:/home/appuser/.azure:ro
    depends_on:
      - rabbitmq

  practitioner-service:
    build:
      context: ./backend-container/PractitionerService
      dockerfile: ${PRACTITIONER_SERVICE_DOCKERFILE:-Dockerfile}
    container_name: practitioner-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Test}
      ASPNETCORE_URLS: http://+:8081
          ConnectionStrings__DefaultConnection: ${USER_SERVICE_CONNECTION}
  # Align JWT config with UserService so issued tokens validate here
      Jwt__SecretKey: "DevelopmentOnly_DefaultJwtSecret_DoNotUseInProd_ChangeMe123456789"
      Jwt__Issuer: "MedicareApp"
      Jwt__Audience: "MedicareUsers"
      HOME: /home/appuser
      USE_AZURE_DEFAULT_CREDENTIAL: ${USE_AZURE_DEFAULT_CREDENTIAL:-false}
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
      RABBITMQ__HOST: "${RABBITMQ_HOST:-rabbitmq}"
      RABBITMQ__USERNAME: "${RABBITMQ_USERNAME:-medicare}"
      RABBITMQ__PASSWORD: "${RABBITMQ_PASSWORD:-medicare}"
    ports:
      - "8081:8081"
    networks:
      - medicare-network
    restart: unless-stopped
    volumes:
          - ${HOST_AZURE_DIR:-${HOME}/.azure}:/home/appuser/.azure:ro

  patient-service:
    build:
      context: ./backend-container/PatientService
      dockerfile: ${PATIENT_SERVICE_DOCKERFILE:-Dockerfile}
    container_name: patient-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Test}
      ASPNETCORE_URLS: http://+:8082
          ConnectionStrings__DefaultConnection: ${USER_SERVICE_CONNECTION}
      HOME: /home/appuser
      USE_AZURE_DEFAULT_CREDENTIAL: ${USE_AZURE_DEFAULT_CREDENTIAL:-false}
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
      RABBITMQ__HOST: "${RABBITMQ_HOST:-rabbitmq}"
      RABBITMQ__USERNAME: "${RABBITMQ_USERNAME:-medicare}"
      RABBITMQ__PASSWORD: "${RABBITMQ_PASSWORD:-medicare}"
    ports:
      - "8082:8082"
    networks:
      - medicare-network
    restart: unless-stopped
    volumes:
          - ${HOST_AZURE_DIR:-${HOME}/.azure}:/home/appuser/.azure:ro
    depends_on:
      - rabbitmq

  medical-catalog-service:
    build:
      context: ./backend-container/MedicalCatalogService
      dockerfile: ${MEDICAL_CATALOG_SERVICE_DOCKERFILE:-MedicalCatalogService/Dockerfile}
    container_name: medical-catalog-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Test}
      ASPNETCORE_URLS: http://+:8083
          ConnectionStrings__DefaultConnection: ${USER_SERVICE_CONNECTION}
      HOME: /home/appuser
      USE_AZURE_DEFAULT_CREDENTIAL: ${USE_AZURE_DEFAULT_CREDENTIAL:-false}
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
    ports:
      - "8083:8083"
    networks:
      - medicare-network
    restart: unless-stopped
    volumes:
          - ${HOST_AZURE_DIR:-${HOME}/.azure}:/home/appuser/.azure:ro

  billing-service:
    build:
      context: ./backend-container/BillingService
      dockerfile: Dockerfile
    container_name: billing-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Test}
      ASPNETCORE_URLS: http://+:8085
          ConnectionStrings__DefaultConnection: ${USER_SERVICE_CONNECTION}
      HOME: /home/appuser
      USE_AZURE_DEFAULT_CREDENTIAL: ${USE_AZURE_DEFAULT_CREDENTIAL:-false}
      BILLING_BYPASS_AUTH: "true"
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
    ports:
      - "8085:8085"
    networks:
      - medicare-network
    restart: unless-stopped
    volumes:
          - ${HOST_AZURE_DIR:-${HOME}/.azure}:/home/appuser/.azure:ro

  documents-service:
    build:
      context: ./backend-container/DocumentsService
      dockerfile: Dockerfile
    container_name: documents-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Test}
      ASPNETCORE_URLS: http://+:8084
          ConnectionStrings__DefaultConnection: ${USER_SERVICE_CONNECTION}
      HOME: /home/appuser
      USE_AZURE_DEFAULT_CREDENTIAL: ${USE_AZURE_DEFAULT_CREDENTIAL:-false}
      DOCUMENTS_BYPASS_AUTH: "true"
      RABBITMQ__HOST: "${RABBITMQ_HOST:-rabbitmq}"
      RABBITMQ__USERNAME: "${RABBITMQ_USERNAME:-medicare}"
      RABBITMQ__PASSWORD: "${RABBITMQ_PASSWORD:-medicare}"
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
    ports:
      - "8084:8084"
    networks:
      - medicare-network
    restart: unless-stopped
    volumes:
          - ${HOST_AZURE_DIR:-${HOME}/.azure}:/home/appuser/.azure:ro
    depends_on:
      - rabbitmq

  appointment-service:
    build:
      context: ./backend-container/AppointmentService
      dockerfile: Dockerfile
    container_name: appointment-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Test}
      ASPNETCORE_URLS: http://+:8087
          ConnectionStrings__DefaultConnection: ${USER_SERVICE_CONNECTION}
      HOME: /home/appuser
      USE_AZURE_DEFAULT_CREDENTIAL: ${USE_AZURE_DEFAULT_CREDENTIAL:-false}
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
      RABBITMQ__HOST: "${RABBITMQ_HOST:-rabbitmq}"
      RABBITMQ__USERNAME: "${RABBITMQ_USERNAME:-medicare}"
      RABBITMQ__PASSWORD: "${RABBITMQ_PASSWORD:-medicare}"
    ports:
      - "8087:8087"
    networks:
      - medicare-network
    restart: unless-stopped
    volumes:
          - ${HOST_AZURE_DIR:-${HOME}/.azure}:/home/appuser/.azure:ro

  medical-records-service:
    build:
      context: ./backend-container/MedicalRecordsService
      dockerfile: Dockerfile
    container_name: medical-records-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Test}
      ASPNETCORE_URLS: http://+:8088
          ConnectionStrings__DefaultConnection: ${USER_SERVICE_CONNECTION}
      HOME: /home/appuser
      USE_AZURE_DEFAULT_CREDENTIAL: ${USE_AZURE_DEFAULT_CREDENTIAL:-false}
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
    ports:
      - "8088:8088"
    networks:
      - medicare-network
    restart: unless-stopped
    volumes:
          - ${HOST_AZURE_DIR:-${HOME}/.azure}:/home/appuser/.azure:ro

  lab-service:
    build:
      context: ./backend-container/LabService
      dockerfile: Dockerfile
    container_name: lab-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Test}
      ASPNETCORE_URLS: http://+:8089
          ConnectionStrings__DefaultConnection: ${USER_SERVICE_CONNECTION}
      HOME: /home/appuser
      USE_AZURE_DEFAULT_CREDENTIAL: ${USE_AZURE_DEFAULT_CREDENTIAL:-false}
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
      # Align JWT config with UserService so issued tokens validate here
      Jwt__SecretKey: "DevelopmentOnly_DefaultJwtSecret_DoNotUseInProd_ChangeMe123456789"
      Jwt__Issuer: "MedicareApp"
      Jwt__Audience: "MedicareUsers"
      # RabbitMQ settings used when publishing notifications from LabService
      RABBITMQ__HOST: "${RABBITMQ_HOST:-rabbitmq}"
      RABBITMQ__USERNAME: "${RABBITMQ_USERNAME:-medicare}"
      RABBITMQ__PASSWORD: "${RABBITMQ_PASSWORD:-medicare}"
    ports:
      - "8089:8089"
    networks:
      - medicare-network
    restart: unless-stopped
    volumes:
          - ${HOST_AZURE_DIR:-${HOME}/.azure}:/home/appuser/.azure:ro

  archive-service:
    build:
      context: ./backend-container/ArchiveService
      dockerfile: Dockerfile
    container_name: archive-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Test}
      ASPNETCORE_URLS: http://+:8091
      ConnectionStrings__ArchiveDb: Data Source=/data/archive.db
      RABBITMQ__HOST: "${RABBITMQ_HOST:-rabbitmq}"
      RABBITMQ__USERNAME: "${RABBITMQ_USERNAME:-medicare}"
      RABBITMQ__PASSWORD: "${RABBITMQ_PASSWORD:-medicare}"
    ports:
      - "8091:8091"
    networks:
      - medicare-network
    restart: unless-stopped
    volumes:
      - archive_data:/data
    depends_on:
      - rabbitmq

  notification-service:
    build:
      context: ./backend-container/NotificationService
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Test}
      ASPNETCORE_URLS: http://+:8090
          ConnectionStrings__DefaultConnection: ${USER_SERVICE_CONNECTION}
      PURGE_NOTIFICATIONS_SCHEMA: "true"
      USE_AZURE_DEFAULT_CREDENTIAL: ${USE_AZURE_DEFAULT_CREDENTIAL:-false}
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
      RABBITMQ__HOST: "${RABBITMQ_HOST:-rabbitmq}"
      RABBITMQ__USERNAME: "${RABBITMQ_USERNAME:-medicare}"
      RABBITMQ__PASSWORD: "${RABBITMQ_PASSWORD:-medicare}"
    ports:
      - "8090:8090"
    networks:
      - medicare-network
    restart: unless-stopped
    volumes:
          - ${HOST_AZURE_DIR:-${HOME}/.azure}:/home/appuser/.azure:ro
    depends_on:
      - rabbitmq

  pdf-service:
    build:
      context: ./backend-container/PdfService
      dockerfile: Dockerfile
    container_name: pdf-service
    environment:
      RABBITMQ__HOST: "${RABBITMQ_HOST:-rabbitmq}"
      RABBITMQ__USERNAME: "${RABBITMQ_USERNAME:-medicare}"
      RABBITMQ__PASSWORD: "${RABBITMQ_PASSWORD:-medicare}"
    networks:
      - medicare-network
    restart: unless-stopped
    depends_on:
      - rabbitmq

  messaging-service:
    build:
      context: ./backend-container/MessagingService
      dockerfile: Dockerfile
    container_name: messaging-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Test}
      ASPNETCORE_URLS: http://+:8086
          ConnectionStrings__DefaultConnection: ${USER_SERVICE_CONNECTION}
      HOME: /home/appuser
      USE_AZURE_DEFAULT_CREDENTIAL: ${USE_AZURE_DEFAULT_CREDENTIAL:-false}
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
    ports:
      - "8086:8086"
    networks:
      - medicare-network
    restart: unless-stopped
    volumes:
      - ${HOST_AZURE_DIR:-${HOME}/.azure}:/home/appuser/.azure:ro

  frontend:
    build:
      context: ./frontend-container/medicare-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: medicare-frontend
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - user-service
      - practitioner-service
      - patient-service
      - medical-catalog-service
      - documents-service
      - billing-service
      - appointment-service
      - medical-records-service
      - lab-service
      - messaging-service
      - notification-service
    networks:
      - medicare-network
    restart: unless-stopped

  # Optional local SQL Server for development (disabled by default; uncomment to use)
  # sqlserver:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   container_name: sqlserver
  #   environment:
  #     ACCEPT_EULA: Y
  #     SA_PASSWORD: YourStrong!Passw0rd
  #   ports:
  #     - "1433:1433"
  #   healthcheck:
  #     test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1' || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 20s
  #   networks:
  #     - medicare-network

networks:
  medicare-network:
    driver: bridge

volumes:
  archive_data: {}
