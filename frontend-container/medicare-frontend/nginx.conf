server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve Docker service names at request time to avoid stale upstream IPs after container restarts
  resolver 127.0.0.11 ipv6=off valid=30s;

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  # Ensure the SPA index is never cached so new JS bundles are pulled after deploys
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  # Proxy API requests to user-service container
  location /api/ {
    # Use variable form so DNS is resolved per request
    set $user_service http://user-service:8080;
    proxy_pass $user_service;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  # Proxy documents API requests to documents-service container
  location = /api/documents {
    return 301 /api/documents/;
  }
  location /api/documents/ {
    set $documents_service http://documents-service:8084;
    proxy_pass $documents_service;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  # Proxy billing API requests to billing-service container
  location = /api/billing {
    return 301 /api/billing/;
  }
  location /api/billing/ {
    set $billing_service http://billing-service:8085;
    proxy_pass $billing_service;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  # Proxy practitioner API requests to practitioner-service container
  location /api/practitioner/ {
    set $practitioner_service http://practitioner-service:8081;
    proxy_pass $practitioner_service;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Proxy patient API requests to patient-service container
  location /api/patient/ {
    set $patient_service http://patient-service:8082;
    proxy_pass $patient_service;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  # Proxy appointment API requests to appointment-service container
  location /api/appointment/ {
    set $appointment_service http://appointment-service:8087;
    proxy_pass $appointment_service;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  # Proxy notifications API requests to notification-service container (no redirect to preserve query params)
  location ^~ /api/notifications {
    set $notification_service http://notification-service:8090;
    proxy_pass $notification_service;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  # Proxy medical catalog API requests to medical-catalog-service container
  location /api/catalog/ {
    set $catalog_service http://medical-catalog-service:8083;
    proxy_pass $catalog_service;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Proxy appointment analytics API requests to appointment-service container
  location /api/appointment/ {
    proxy_pass http://appointment-service:8087/api/appointment/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Proxy lab API requests to lab-service container
  location /api/lab/ {
    proxy_pass http://lab-service:8089/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Proxy medical records API requests to medical-records-service container
  location /api/medical-records/ {
    proxy_pass http://medical-records-service:8088/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Proxy messaging API requests to messaging-service container
  location /api/messaging/ {
    proxy_pass http://messaging-service:8086/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Proxy general API requests to user-service container (MUST BE LAST!)
  location /api/ {
    proxy_pass http://user-service:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }
}
