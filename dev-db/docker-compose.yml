services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-dev
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "${DB_PORT}:1433"
    volumes:
      - mssql-data:/var/opt/mssql        # persistent data
      - ./seed:/seed:ro                  # read-only seed scripts
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  seed:
    image: mcr.microsoft.com/mssql-tools:latest
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./seed:/seed:ro
    entrypoint: ["/bin/bash", "-lc", "/opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P ${SA_PASSWORD} -Q \"CREATE DATABASE [${DB_NAME}]\" || true; /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P ${SA_PASSWORD} -d ${DB_NAME} -i /seed/01_schema.sql; /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P ${SA_PASSWORD} -d ${DB_NAME} -i /seed/02_data.sql"]
    # one-shot job; it will exit after seeding

volumes:
  mssql-data:
